<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in or register for CareerForge AI to build your AI resume, portfolio, and run your Career Agent.">
  <title>Sign In / Register — CareerForge AI</title>
  
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
  
  <style>
    .auth-card {
      max-width: 480px;
      width: 100%;
      padding: 2.5rem 2.25rem;
      border-radius: var(--radius-lg);
      background: linear-gradient(145deg, rgba(30, 41, 59, 0.85) 0%, rgba(15, 23, 42, 0.95) 100%);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.8), 0 0 35px rgba(99, 102, 241, 0.25);
      position: relative;
    }
    .auth-card::before {
      content: '';
      position: absolute;
      top: -1px;
      left: 15%;
      right: 15%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #818CF8, #06B6D4, transparent);
    }
    .auth-tabs {
      display: flex;
      background: rgba(15, 23, 42, 0.8);
      padding: 0.35rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-glass);
      margin-bottom: 2rem;
      gap: 0.35rem;
    }
    .auth-tab-btn {
      flex: 1;
      padding: 0.65rem 1rem;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-secondary);
      background: transparent;
      border: none;
      cursor: pointer;
      transition: all var(--transition-fast);
      text-align: center;
    }
    .auth-tab-btn.active {
      background: var(--grad-primary);
      color: #fff;
      box-shadow: 0 2px 10px rgba(99, 102, 241, 0.4);
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <a href="../index.html" class="nav-brand">
      <div class="brand-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
        </svg>
      </div>
      <span>CareerForge</span>
      <span class="brand-badge">AI Auth</span>
    </a>
    <div class="nav-actions">
      <button type="button" class="btn btn-secondary btn-sm" onclick="if(history.length>1){history.back();}else{window.location.href='../index.html';}" style="display:inline-flex; align-items:center; gap:0.4rem;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        <span>Back</span>
      </button>
    </div>
  </nav>

  <main class="main-content" style="display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 180px); padding: 2rem 1.5rem;">
    <div class="auth-card">
      
      <!-- Top Neon Pill -->
      <div style="text-align: center; margin-bottom: 1.25rem;">
        <span class="badge badge-primary" style="padding: 4px 12px; font-size: 0.8rem;">✨ Next-Gen AI Career Hub</span>
      </div>

      <!-- Tab Header -->
      <div class="auth-tabs">
        <button class="auth-tab-btn active" id="tab-login-btn">Sign In</button>
        <button class="auth-tab-btn" id="tab-signup-btn">Create Account</button>
      </div>

      <!-- Auth Form Header -->
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <h2 id="auth-title" style="font-size: 1.6rem;">Welcome Back</h2>
        <p id="auth-subtitle" style="font-size: 0.85rem; margin-top: 0.25rem; color: var(--text-secondary);">Access your AI Career dossier and agent</p>
      </div>

      <!-- Alert Banner -->
      <div id="auth-alert" style="display: none; padding: 0.85rem 1rem; border-radius: var(--radius-md); margin-bottom: 1.25rem; font-size: 0.85rem; line-height: 1.45;"></div>

      <!-- Main Form -->
      <form id="auth-form">
        <!-- Display Name (Sign Up only) -->
        <div class="form-group" id="group-display-name" style="display: none;">
          <label class="form-label" for="input-display-name">Full Name</label>
          <input class="form-input" type="text" id="input-display-name" placeholder="e.g. Jane Doe" autocomplete="name">
        </div>

        <!-- Email -->
        <div class="form-group">
          <label class="form-label" for="input-email">Email Address</label>
          <input class="form-input" type="email" id="input-email" placeholder="e.g. jane@example.com" required autocomplete="email">
        </div>

        <!-- Password -->
        <div class="form-group">
          <div class="form-label" style="display: flex; justify-content: space-between; align-items: center;">
            <span>Password</span>
            <a href="#" id="link-forgot-password" style="font-size: 0.75rem; color: var(--primary-light);">Forgot?</a>
          </div>
          <input class="form-input" type="password" id="input-password" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary" id="btn-auth-submit" style="width: 100%; margin-top: 0.75rem; padding: 0.75rem;">
          <span>Sign In</span>
        </button>
      </form>

      <!-- Divider -->
      <div style="display: flex; align-items: center; margin: 1.5rem 0; gap: 1rem;">
        <div style="flex: 1; height: 1px; background: var(--border-subtle);"></div>
        <span style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em;">Or continue with</span>
        <div style="flex: 1; height: 1px; background: var(--border-subtle);"></div>
      </div>

      <!-- Social & Demo Logins -->
      <div style="display: flex; flex-direction: column; gap: 0.75rem;">
        <!-- Google Sign-In -->
        <button type="button" class="btn btn-secondary" id="btn-google-auth" style="width: 100%;">
          <svg width="18" height="18" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.35 24 12 24z"/>
            <path fill="#FBBC05" d="M5.28 14.27A7.2 7.2 0 0 1 4.9 12c0-.79.14-1.57.38-2.27V6.58H1.25A11.96 11.96 0 0 0 0 12c0 1.92.45 3.74 1.25 5.42l4.03-3.15z"/>
            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.35 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
          </svg>
          <span>Sign in with Google</span>
        </button>

        <!-- Quick Demo User Login (One-click reviewer sandbox) -->
        <button type="button" class="btn btn-outline" id="btn-demo-login" style="width: 100%;">
          <span>🚀 Explore as Demo Student (1-Click)</span>
        </button>
      </div>

    </div>
  </main>

  <!-- Password Reset Modal -->
  <div class="modal-backdrop" id="modal-reset-password">
    <div class="modal-container" style="max-width: 420px;">
      <div class="modal-header">
        <h3 class="card-title">Reset Password</h3>
        <button class="btn btn-secondary btn-icon" id="btn-close-reset-modal">&times;</button>
      </div>
      <div class="modal-body">
        <p style="font-size: 0.9rem; margin-bottom: 1rem; color: var(--text-secondary);">
          Enter your registered email address and we'll send you a password reset link.
        </p>
        <div class="form-group">
          <label class="form-label" for="input-reset-email">Email Address</label>
          <input class="form-input" type="email" id="input-reset-email" placeholder="e.g. jane@example.com">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="btn-cancel-reset">Cancel</button>
        <button class="btn btn-primary" id="btn-submit-reset">Send Reset Link</button>
      </div>
    </div>
  </div>

  <script type="module" src="../js/pages/auth.js"></script>
</body>
</html>

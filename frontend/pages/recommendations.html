<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AI Career Recommendations — Discover ranked career paths, quantitative fit scores, market outlook, and salary benchmarks.">
  <title>AI Career Recommendations — CareerForge AI</title>
  
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <!-- Navigation Shell -->
  <header id="app-navbar-container"></header>

  <!-- Main Content -->
  <main class="main-content">
    
    <!-- Top Action Bar -->
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 2rem;">
      <div style="display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;">
        <button type="button" class="btn btn-secondary btn-sm" onclick="if(history.length>1){history.back();}else{window.location.href='dashboard.html';}" style="display:inline-flex; align-items:center; gap:0.4rem;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          <span>Back</span>
        </button>
        <div>
          <div style="display: flex; align-items: center; gap: 0.75rem;">
            <h1 style="font-size: 1.75rem;">AI Career & Course Recommendations</h1>
            <span class="badge badge-emerald">Dynamic Analysis</span>
          </div>
          <p style="font-size: 0.85rem;">Discover customized career tracks and curated official courses based on your exact desired role or profile.</p>
        </div>
      </div>

      <div style="display: flex; gap: 0.75rem; align-items: center;">
        <button class="btn btn-ai" id="btn-refresh-recommendations">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
          <span>Recommend for Role ✨</span>
        </button>
      </div>
    </div>

    <!-- 1. Interactive Job Role Selector & Career Explorer -->
    <div class="card card-glass" style="margin-bottom: 2rem;">
      <div style="margin-bottom: 1rem;">
        <label class="form-label" style="font-size: 0.85rem; margin-bottom: 0.5rem; display: block;">Select a Job Role or Type What You Want to Learn:</label>
        <div style="display: flex; flex-wrap: wrap; gap: 0.5rem;" id="rec-role-chips">
          <button type="button" class="btn btn-sm btn-outline btn-rec-role-chip active" data-role="Web Developer">Web Developer</button>
          <button type="button" class="btn btn-sm btn-outline btn-rec-role-chip" data-role="Frontend Developer">Frontend Developer</button>
          <button type="button" class="btn btn-sm btn-outline btn-rec-role-chip" data-role="Backend Developer">Backend Developer</button>
          <button type="button" class="btn btn-sm btn-outline btn-rec-role-chip" data-role="Full Stack Developer">Full Stack Developer</button>
          <button type="button" class="btn btn-sm btn-outline btn-rec-role-chip" data-role="Data Scientist">Data Scientist</button>
          <button type="button" class="btn btn-sm btn-outline btn-rec-role-chip" data-role="DevOps & Cloud Engineer">DevOps & Cloud</button>
          <button type="button" class="btn btn-sm btn-outline btn-rec-role-chip" data-role="Mobile App Developer">Mobile App Developer</button>
          <button type="button" class="btn btn-sm btn-outline btn-rec-role-chip" data-role="Cybersecurity Analyst">Cybersecurity Analyst</button>
          <button type="button" class="btn btn-sm btn-outline btn-rec-role-chip" data-role="UI/UX Designer">UI/UX Designer</button>
        </div>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
        <div style="flex: 1; min-width: 280px;">
          <label class="form-label" style="font-size: 0.8rem;" for="input-rec-target-role">Target Career Path / Job Role:</label>
          <div style="display: flex; gap: 0.5rem; margin-top: 0.35rem;">
            <input type="text" class="form-input" id="input-rec-target-role" placeholder="e.g. Web Developer, AI Prompt Engineer, Game Developer..." value="Web Developer">
            <button class="btn btn-primary btn-sm" id="btn-submit-role-analysis">Analyze & Recommend 🎯</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Executive Summary Card -->
    <div class="card card-glass" style="margin-bottom: 2rem; border-color: rgba(99, 102, 241, 0.3); background: linear-gradient(135deg, rgba(99,102,241,0.06) 0%, rgba(17,24,39,0.85) 100%);">
      <div style="display: flex; gap: 1.5rem; align-items: center; flex-wrap: wrap;">
        <div class="score-circle" id="summary-top-fit-circle" style="--score: 94;">
          <span class="score-value" id="summary-top-score">94%</span>
        </div>
        <div style="flex: 1; min-width: 280px;">
          <span class="ai-badge" style="margin-bottom: 0.5rem;">Top Recommended Path</span>
          <h2 style="font-size: 1.4rem; color: var(--text-primary);" id="summary-top-role">Full Stack Software Engineer</h2>
          <p style="font-size: 0.9rem; margin-top: 0.35rem; color: var(--text-secondary);" id="summary-executive-text">
            Loading tailored career alignment synthesis...
          </p>
        </div>
      </div>
    </div>

    <!-- Ranked Career Cards Grid -->
    <div id="career-paths-grid" class="grid grid-cols-2">
      <!-- Rendered by JS -->
    </div>

  </main>

  <script type="module" src="../js/pages/recommendations.js?v=2.3.0"></script>
</body>
</html>
